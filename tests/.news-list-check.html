<!doctype html><html><head><meta charset="UTF-8"></head><body><div id="app"></div><script type="module">
import { createApp, ref } from 'vue'
import NewsList from '/src/components/NewsList/index.vue'
createApp({
  components: { NewsList },
  setup() {
    const tags = ref([{ label: '最新', value: 'latest' }, { label: '公告', value: 'notices' }])
    const records = ref([{ id: '1', tab: 'notices', title: '公告测试', date: '2026.09.09' }, { id: '2', tab: 'maintenance', title: '维护测试', date: '2026.09.09' }])
    return { tags, records, add: () => tags.value.push({ label: '维护', value: 'maintenance' }), remove: () => tags.value = tags.value.filter(t => t.value !== 'maintenance'), clear: () => tags.value = [] }
  },
  template: `<button @click="add">添加分类</button><button @click="remove">删除维护</button><button @click="clear">清空分类</button><NewsList :tags="tags" :records="records" />`,
}).mount('#app')
</script></body></html>
